name: Repair journal video delivery
on:
  push:
    paths:
      - '.github/workflows/repair-journal-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing MP4 files and update player
        run: |
          python3 - <<'PY'
          import pathlib, re, base64
          p = pathlib.Path('Double-Study-Journal.html')
          s = p.read_text()
          matches = list(re.finditer(r'data:video/mp4;base64,([A-Za-z0-9+/=]+)', s))
          if not matches:
              print('Already repaired')
              raise SystemExit(0)
          assert len(matches) == 4
          folder = pathlib.Path('assets/journal-videos')
          folder.mkdir(parents=True, exist_ok=True)
          for m, name in reversed(list(zip(matches, ['18413','18415','18414','18417']))):
              data = base64.b64decode(m.group(1), validate=True)
              assert data[4:8] == b'ftyp'
              dest = folder / (name + '.mp4')
              dest.write_bytes(data)
              s = s[:m.start()] + './' + dest.as_posix() + s[m.end():]
          p.write_text(s)
          PY
      - name: Commit repaired assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Double-Study-Journal.html assets/journal-videos
          if ! git diff --cached --quiet; then
            git commit -m "Serve journal videos as standalone MP4 files"
            git push
          fi

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111914"><title>创世纪 Genesis · 生命演化沙盒</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%23ace7a7'/%3E%3Cpath fill='%231a3522' d='M4 8h5v2h3v2h1V8h2V5h6v5h-2v2h-4v7h-3v-4H8v-2H5z'/%3E%3C/svg%3E"></head><body>
<header class="header"><div class="mast"><a class="brand" href="#sandbox" aria-label="创世纪首页"><span class="brand-icon"><svg viewBox="0 0 24 24"><path d="M3 7h5v2h3v2h1v2h1V8h2V5h3V3h4v7h-2v2h-4v2h-1v7h-3v-5H8v-2H5v-3H3z"/></svg></span><b>GENESIS</b><span class="brand-cn">创世纪</span></a><nav aria-label="主导航"><button data-view="sandbox" class="nav active"><i data-i="map"></i>演化沙盒</button><button data-view="atlas" class="nav"><i data-i="book"></i>物种图鉴</button><button data-view="log" class="nav"><i data-i="history"></i>演化记录</button></nav><button class="guide" id="guide"><i data-i="help"></i><span>实验指南</span></button></div></header>
<main><section id="sandboxView" class="view"><div class="hero"><div><div class="eyebrow"><span class="signal"></span>EVOLUTION SANDBOX</div><h1>生命演化沙盒</h1><p>观察一片像素旷野里的觅食、繁衍与自然选择。</p></div><div class="hero-actions"><button class="button" id="archive"><i data-i="save"></i>世界存档</button><button class="button light" id="newWorld"><i data-i="plus"></i>新建世界</button></div></div><div class="stats" id="stats"></div>
<div class="dashboard"><section class="panel world-panel"><div class="panel-heading"><div class="heading-group"><i class="accent" data-i="scan"></i><h2>生态观察区</h2></div><span id="liveTag" class="live-tag"><b></b>模拟运行中</span></div><div class="stage" id="stage"><canvas id="world" tabindex="0" aria-label="生态地图，点击生物查看档案，也可以使用选择个体按钮。"></canvas><div class="location"><i data-i="pin"></i><span id="worldName">青苔溪谷</span></div><div class="weather"><i data-i="sun"></i><span id="season">春季</span></div><button class="expand" id="expand" aria-label="放大地图" title="放大地图"><i data-i="expand"></i></button><div class="map-prompt" id="mapPrompt" hidden></div></div><div class="transport"><button id="pause" class="pause"><i data-i="pause"></i><span>暂停</span></button><span class="speed-label">倍速</span><div id="speeds" class="speeds" aria-label="模拟速度"></div><div class="day"><i data-i="clock"></i><span id="day">第 1 天</span></div></div><div class="legend"><div><span><b class="dot rabbit"></b>草食生物</span><span><b class="dot fox"></b>肉食生物</span><span><b class="dot bird"></b>杂食生物</span></div><button id="pick"><i data-i="cursor"></i>选择个体</button></div></section>
<aside class="sidebar"><section class="panel settings"><div class="panel-heading"><div class="heading-group"><i class="accent" data-i="sliders"></i><h2>环境参数</h2></div><button id="defaultSettings" class="icon-only" aria-label="恢复默认参数" title="恢复默认参数"><i data-i="reset"></i></button></div><div class="parameters">
<div class="parameter"><label for="foodRate"><i data-i="leaf"></i>食物再生率<output id="foodVal"></output></label><input id="foodRate" type="range" min="0" max="200" step="5"><div class="range-ends"><span>贫瘠</span><span>丰饶</span></div></div>
<div class="parameter"><label for="mutation"><i data-i="dna"></i>基因变异率<output id="mutationVal"></output></label><input id="mutation" type="range" min="0" max="50" step="1"><div class="range-ends"><span>稳定</span><span>多变</span></div></div>
<div class="parameter"><label for="threshold"><i data-i="energy"></i>繁殖能量阈值<output id="thresholdVal"></output></label><input id="threshold" type="range" min="45" max="95" step="1"><div class="range-ends"><span>易繁殖</span><span>难繁殖</span></div></div>
</div></section><section class="panel interventions"><div class="panel-heading"><div class="heading-group"><i class="accent" data-i="zap"></i><h2>生态干预</h2></div></div><div class="tools"><button id="addFood"><i data-i="sprout"></i>投放食物</button><button id="addLife"><i data-i="paw"></i>引入生物</button><button id="famine" class="danger"><i data-i="sun"></i>引发饥荒</button></div></section></aside></div></section>
<section id="atlasView" class="view" hidden><div class="hero"><div><div class="eyebrow"><span class="signal"></span>FIELD GUIDE</div><h1>物种图鉴</h1><p>认识溪谷里的三个种群，追踪它们遗传下来的生存策略。</p></div></div><div class="atlas-grid" id="speciesCards"></div><section class="panel census"><div class="panel-heading"><div class="heading-group"><i data-i="scan" class="accent"></i><h2>在世个体</h2></div><select id="speciesFilter" aria-label="筛选种群"><option value="all">所有种群</option><option value="rabbit">草食生物</option><option value="fox">肉食生物</option><option value="bird">杂食生物</option></select></div><div id="census"></div></section></section>
<section id="logView" class="view" hidden><div class="hero"><div><div class="eyebrow"><span class="signal"></span>FIELD JOURNAL</div><h1>演化记录</h1><p>从种群曲线和世界大事记里，回看溪谷的变化。</p></div></div><div class="log-layout"><section class="panel"><div class="panel-heading"><div class="heading-group"><i data-i="chart" class="accent"></i><h2>种群趋势</h2></div><span class="meta">最近 60 个观测点</span></div><div id="trend"></div></section><section class="panel"><div class="panel-heading"><div class="heading-group"><i data-i="history" class="accent"></i><h2>世界大事记</h2></div></div><div id="events"></div></section></div></section></main><footer class="journal-return"><a href="../Double-Study-Journal.html#creative">返回 Double 的创意实验室</a></footer>
<dialog id="dialog"><div class="dialog-top"><div><span class="eyebrow" id="dialogKicker"></span><h2 id="dialogTitle"></h2></div><button class="close icon-only" aria-label="关闭"><i data-i="close"></i></button></div><div id="dialogBody"></div></dialog><div id="toast" role="status" hidden></div><script src="art.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
